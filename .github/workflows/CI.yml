name: Deploy Config

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply formatting
        run: npm run format

      - name: Commit formatting changes
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add .
            git commit -m "Apply Prettier formatting"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Validate configs
        if: github.actor != 'github-actions[bot]'
        run: node validate-configs.js

  deploy:
    runs-on: ubuntu-latest
    needs: format-and-validate
    if: github.event_name == 'push'
    steps:
      - name: Trigger Config Update
        run: |
          # Generate signature from the exact payload string
          payload='{"ref":"refs/heads/main","repository":{"name":"config-repo"}}'
          sig=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | awk '{print $2}')
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=${sig}" \
            -d "$payload" \
            https://rampagent.vatsim.fr/api/config-webhook
